truth_summary: >
  Counterfactual orbit case with a massive hidden body. The unseen outer body has a substantial mass, not the negligible mass of a test particle, and its pull and position explain the residual of the outer target. The known bodies still obey the standard force law, and momentum and angular momentum are conserved once the hidden body is included. The memorised answer, an inverse-square law with a relativistic precession term, is wrong for this variant; the correct explanation is the massive unseen body.
items:
  - id: names_hidden_object
    criterion: "Names an unseen outer body with substantial mass, not a negligible test particle, and gives its location or orbit as the cause of the residual."
    applies_when: always
  - id: conservation_law_rescued
    criterion: "States that the known bodies still obey the standard force law, and that momentum and angular momentum are conserved once the massive hidden body is included."
    applies_when: always
  - id: alternatives_rejected_with_reason
    criterion: "Lists at least two alternatives from a modified force law, a standard relativistic precession term, and an observation error, and gives a specific reason for rejecting each one listed."
    applies_when: always
  - id: discriminating_experiment
    criterion: "Proposes a sky search at the predicted position of the massive body, or a check that the residual follows its predicted path over a long baseline, to separate it from a change in the force law."
    applies_when: always
  - id: understandable_without_formulas
    criterion: "Explains the orbital residual and the proposed cause in plain words, about bodies, pulls and orbits, so a reader can follow it without equations; any formula is glossed in words."
    applies_when: always
