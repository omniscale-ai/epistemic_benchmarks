truth_summary: >
  Neptune-like case with real names. An unseen outer body with real mass perturbs the orbit of the outer target planet and produces its residual longitude drift. Newtonian gravity and the known bodies are unchanged; the hidden body is the carrier of the residual, and total momentum and angular momentum of the whole system, including the hidden body, are conserved. An independent check is consistent with the body: a search in the predicted sky region finds it.
items:
  - id: names_hidden_object
    criterion: "Names a specific unseen outer body, with an approximate orbit or sky position, as the cause of the outer planet's residual, not just an unknown effect."
    applies_when: always
  - id: anomaly_resolved
    criterion: "States which observed anomaly the proposed mechanism removes (what the baseline T0 model predicts versus what the data show, namely the longitude residual of the target body versus the Newtonian T0 prediction) and what would stay unexplained without the mechanism."
    applies_when: always
  - id: alternatives_rejected_with_reason
    criterion: "Lists at least two alternative explanations other than the one the answer chooses, for example from a modified force law acting on all bodies, an observation or ephemeris error, and a non-gravitational effect, each with a stated reason for rejection based on the data."
    applies_when: always
  - id: discriminating_experiment
    criterion: "Proposes a targeted search at the predicted sky position of the body, or a check that the residual follows the body's predicted path over time, as a test that separates it from a modified force law."
    applies_when: always
  - id: cause_stated_plainly
    criterion: "The first paragraph of the Explanation section names the proposed cause and says in plain words what it is and what it does to the observations, before giving numbers or formulas."
    applies_when: always
