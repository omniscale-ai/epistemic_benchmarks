truth_summary: >
  Synthetic orbit case in an invented solar system with invented bodies and invented conservation rules. An invented outer body with mass perturbs the target body, and the generator's own conservation rules hold once the body is included. The explanation must identify the invented body and its role, not a real planet, and it must not rely on the familiar solar system.
items:
  - id: names_hidden_object
    criterion: "Names the invented outer body of the synthetic system, using the names in the public files, and gives its role in producing the target's residual."
    applies_when: always
  - id: anomaly_resolved
    criterion: "States which observed anomaly the proposed mechanism removes (what the baseline T0 model predicts versus what the data show, namely the longitude residual of the target body versus the Newtonian T0 prediction) and what would stay unexplained without the mechanism."
    applies_when: always
  - id: alternatives_rejected_with_reason
    criterion: "Lists at least two alternative explanations other than the one the answer chooses, for example from a modification of the force law acting on all bodies, a known real planet as the cause, and an observation error, each with a stated reason for rejection based on the data."
    applies_when: always
  - id: discriminating_experiment
    criterion: "Proposes a targeted search at the predicted location of the invented body, or a check whether other bodies show the same residual, as a test that separates the hypotheses."
    applies_when: always
  - id: cause_stated_plainly
    criterion: "The first paragraph of the Explanation section names the proposed cause and says in plain words what it is and what it does to the observations, before giving numbers or formulas."
    applies_when: always
