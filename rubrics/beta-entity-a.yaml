truth_summary: >
  Beta decay with real names. The parent nucleus decays into the daughter nucleus, an electron, and a hidden neutral light particle of the neutrino type. That particle carries away the missing energy and momentum, so energy and momentum conservation hold for the three-body decay and the continuous electron spectrum is not a violation. The electron spectrum is zero at the kinetic-energy endpoint, and its low-energy shape is modified by a Coulomb correction that depends on the daughter charge. The recoil momentum balances event by event.
items:
  - id: names_hidden_object
    criterion: "Names a specific hidden neutral light particle of the neutrino type as the carrier of the missing energy and momentum, not just unknown energy."
    applies_when: always
  - id: anomaly_resolved
    criterion: "States which observed anomaly the proposed mechanism removes (what the baseline T0 model predicts versus what the data show, namely the continuous electron spectrum and the unbalanced recoil versus the two-body prediction) and what would stay unexplained without the mechanism."
    applies_when: always
  - id: alternatives_rejected_with_reason
    criterion: "Lists at least two alternative explanations other than the one the answer chooses, for example from energy non-conservation, a detector artifact, and more than one hidden particle, each with a stated reason for rejection based on the data."
    applies_when: always
  - id: discriminating_experiment
    criterion: "Proposes a concrete measurement that separates the hidden-particle hypothesis from a detector artifact, such as event-by-event recoil momentum balance or checking that no sharp line appears at the full endpoint energy."
    applies_when: always
  - id: cause_stated_plainly
    criterion: "The first paragraph of the Explanation section names the proposed cause and says in plain words what it is and what it does to the observations, before giving numbers or formulas."
    applies_when: always
