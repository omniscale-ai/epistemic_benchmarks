truth_summary: >
  Neptune-like case with renamed bodies, units and scales. An unseen outer body with mass perturbs the outer target body, and the public files refer to bodies by labels rather than real planets. Newtonian gravity is unchanged, and momentum and angular momentum of the whole system, including the hidden body, are conserved. The residual is the hidden body's pull, so the explanation must use the public-file labels and units.
items:
  - id: names_hidden_object
    criterion: "Names the unseen outer body by its public-file label or an equivalent description, and gives it as the cause of the target body's residual."
    applies_when: always
  - id: anomaly_resolved
    criterion: "States which observed anomaly the proposed mechanism removes (what the baseline T0 model predicts versus what the data show, namely the longitude residual of the target body versus the Newtonian T0 prediction) and what would stay unexplained without the mechanism."
    applies_when: always
  - id: alternatives_rejected_with_reason
    criterion: "Lists at least two alternative explanations other than the one the answer chooses, for example from a modified force law acting on all bodies, a timing or scale error from the rescaled units, and a non-gravitational effect, each with a stated reason for rejection based on the data."
    applies_when: always
  - id: discriminating_experiment
    criterion: "Proposes a targeted search at the predicted position of the hidden body, or a check that the residual follows its predicted path over time, as a test that separates it from a modified force law."
    applies_when: always
  - id: cause_stated_plainly
    criterion: "The first paragraph of the Explanation section names the proposed cause and says in plain words what it is and what it does to the observations, before giving numbers or formulas."
    applies_when: always
