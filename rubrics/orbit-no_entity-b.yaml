truth_summary: >
  Vulcan-like case with renamed bodies, units and scales, and no new body. The inner target body's orbit precesses because the central attraction law is modified by an extra radial term acting on every body. The public files use renamed bodies and rescaled quantities, which must not be mistaken for physics. The real cause is the modified force law, and the explanation must not invent a hidden body.
items:
  - id: no_entity_posited
    criterion: "Does not posit a new unseen body as the cause of the residual, and states that the residual is explained without any additional object."
    applies_when: always
  - id: real_cause_identified
    criterion: "Identifies a modification of the central force law, acting on every body in the system, as the cause of the inner body's residual, using the public-file labels."
    applies_when: always
  - id: alternatives_rejected_with_reason
    criterion: "Lists at least two alternative explanations that are NOT the real cause, such as an unseen perturber or a timing or unit mistake from the rescaled quantities, each with a stated reason for rejection based on the data."
    applies_when: always
  - id: discriminating_experiment
    criterion: "Proposes a test that checks whether the same modified law predicts the residuals of the other bodies, or a targeted search for a hidden body that is expected to return nothing."
    applies_when: always
  - id: cause_stated_plainly
    criterion: "The first paragraph of the Explanation section names the proposed cause and says in plain words what it is and what it does to the observations, before giving numbers or formulas."
    applies_when: always
